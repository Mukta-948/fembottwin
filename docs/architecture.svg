<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" role="img" aria-labelledby="title desc">
  <title id="title">FemMetaboTwin architecture</title>
  <desc id="desc">Patient inputs flow through React, FastAPI, SQLite and the Twin state to a model eligibility gate. Results are a trained prediction only when evidence exists, a labeled personal mean fallback, or unavailable. A synthetic demo path is isolated and disables trained inference.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#668074"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b66122"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#25352d}.title{font-size:29px;font-weight:700}.sub{font-size:14px;fill:#66766d}.head{font-size:15px;font-weight:700}.body{font-size:12px;fill:#53645a}.small{font-size:11px;fill:#63756a}.box{fill:#fff;stroke:#9cb4a4;stroke-width:2;rx:13}.green{fill:#e9f5ed;stroke:#5e9b75;stroke-width:2;rx:13}.amber{fill:#fff3e2;stroke:#be6d2b;stroke-width:2;rx:13}.gray{fill:#f1f3f1;stroke:#9aa49d;stroke-width:2;rx:13}.line{fill:none;stroke:#668074;stroke-width:2.4;marker-end:url(#arrow)}.dash{fill:none;stroke:#748a7c;stroke-width:2.4;stroke-dasharray:8 6;marker-end:url(#arrow)}.simline{fill:none;stroke:#b66122;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrowOrange)}
    </style>
  </defs>
  <rect width="1500" height="960" fill="#f7f8f5"/>
  <text x="48" y="54" class="title">FemMetaboTwin · submission architecture</text>
  <text x="48" y="80" class="sub">Implemented local workflow and evidence-gated prediction paths · no verified real-data model is installed</text>

  <rect x="40" y="125" width="190" height="92" class="box"/><text x="58" y="158" class="head">Patient input</text><text x="58" y="183" class="body">Glucose, meal context,</text><text x="58" y="201" class="body">optional feedback</text>
  <rect x="285" y="125" width="190" height="92" class="box"/><text x="303" y="158" class="head">React workspace</text><text x="303" y="183" class="body">Patient and clinician</text><text x="303" y="201" class="body">demo views</text>
  <rect x="530" y="125" width="190" height="92" class="box"/><text x="548" y="158" class="head">FastAPI</text><text x="548" y="183" class="body">Validation, state updates,</text><text x="548" y="201" class="body">eligibility and matching</text>
  <rect x="775" y="125" width="225" height="92" class="green"/><text x="793" y="158" class="head">SQLite · local only</text><text x="793" y="183" class="body">Observations, Twin state,</text><text x="793" y="201" class="body">predictions and feedback</text>
  <rect x="1055" y="125" width="190" height="92" class="box"/><text x="1073" y="158" class="head">Twin state</text><text x="1073" y="183" class="body">Mean, variability, history,</text><text x="1073" y="201" class="body">prediction outcomes</text>
  <path d="M230 171H282" class="line"/><path d="M475 171H527" class="line"/><path d="M720 171H772" class="line"/><path d="M1000 171H1052" class="line"/>
  <path d="M1150 217V270" class="line"/>
  <polygon points="1150,270 1240,315 1150,360 1060,315" fill="#f0f4ef" stroke="#668074" stroke-width="2"/>
  <text x="1150" y="309" text-anchor="middle" class="head">Evidence gate</text><text x="1150" y="329" text-anchor="middle" class="small">provenance + features</text><text x="1150" y="345" text-anchor="middle" class="small">+ held-out evidence</text>

  <path d="M1063 330H945V414" class="dash"/><text x="950" y="317" class="small">eligible + complete inputs</text>
  <path d="M1150 360V414" class="line"/><text x="1163" y="392" class="small">not eligible; ≥2 readings</text>
  <path d="M1237 330H1360V414" class="line"/><text x="1260" y="317" class="small">insufficient history</text>
  <rect x="830" y="414" width="230" height="96" class="gray"/><text x="848" y="447" class="head">Trained inference</text><text x="848" y="472" class="body">Only after verified training</text><text x="848" y="492" class="body">and complete eligible inputs</text>
  <rect x="1080" y="414" width="230" height="96" class="amber"/><text x="1098" y="447" class="head">Personal-mean fallback</text><text x="1098" y="472" class="body">Labeled estimate, not ML</text><text x="1098" y="492" class="body">Uncertainty: not estimated</text>
  <rect x="1330" y="414" width="140" height="96" class="gray"/><text x="1348" y="447" class="head">Unavailable</text><text x="1348" y="472" class="body">No eligible</text><text x="1348" y="492" class="body">prediction</text>
  <text x="830" y="535" class="small">All paths return explicit source/status; none applies cycle corrections.</text>
  <path d="M945 510V570H690" class="line"/><path d="M1195 510V570H840" class="line"/><path d="M1400 510V570H920" class="line"/>
  <rect x="440" y="570" width="520" height="90" class="box"/><text x="460" y="604" class="head">Patient forecast, history and trends</text><text x="460" y="630" class="body">Status labels · longitudinal chart · uncertainty explicitly not estimated</text>
  <rect x="1010" y="570" width="420" height="90" class="box"/><text x="1030" y="604" class="head">Clinician demo and system audit</text><text x="1030" y="630" class="body">Read-only presentation view; not authenticated or access-controlled</text>
  <path d="M960 615H1007" class="line"/>
  <rect x="40" y="715" width="400" height="92" class="gray"/><text x="60" y="750" class="head">PhysioNet CGMacros</text><text x="60" y="776" class="body">Official archive; incomplete and unverified here</text><text x="60" y="796" class="body">No extracted schema or real model is available</text>
  <path d="M440 760H487" class="line"/><rect x="490" y="715" width="800" height="92" class="box"/><text x="510" y="750" class="head">Real-data pipeline · blocked before schema inspection</text><text x="510" y="776" class="body">Exact size + SHA-256 → inspect schema → explicit mappings → past-only features</text><text x="510" y="796" class="body">→ future target → participant-held-out evaluation → real artifact + metrics, only if supported</text>
  <path d="M890 715V680H945V510" class="dash"/><text x="960" y="697" class="small">verified real artifact only</text>
  <rect x="220" y="840" width="1060" height="80" class="amber"/><text x="245" y="871" class="head">Separate synthetic demo path · SIMULATED SCENARIO — NOT REAL PATIENT DATA</text><text x="245" y="897" class="body">Fictional ID has its own SQLite rows; reset clears only that ID; trained-model inference is disabled; never used for training or validation.</text>
  <text x="48" y="943" class="small">CGMacros is CC BY-NC-SA 4.0. mcPHASES is restricted, separate, and not merged with CGMacros. No cycle-aware T2D validation is claimed.</text>
</svg>
